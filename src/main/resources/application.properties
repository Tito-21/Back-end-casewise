# =====================================================
# SERVER CONFIGURATION
# =====================================================
spring.application.name=casewise
server.port=8080

# =====================================================
# DATABASE CONFIGURATION (PostgreSQL Database)
# =====================================================
# PostgreSQL for production deployment

# Database URL: PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/Casewise
spring.datasource.username=judge
spring.datasource.password=Judge@123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Suppress HandlerMappingIntrospector warning
logging.level.org.springframework.web.servlet.handler.HandlerMappingIntrospector=ERROR
